name: Try to Create OCI VM

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  snipe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ad:
          - { name: "pGdO:PHX-AD-1", label: "AD-1" }
          - { name: "pGdO:PHX-AD-2", label: "AD-2" }
          - { name: "pGdO:PHX-AD-3", label: "AD-3" }
    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI
        run: |
          pip install oci-cli
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf "[DEFAULT]\nuser=%s\ntenancy=%s\nfingerprint=%s\nkey_file=~/.oci/oci_api_key.pem\nregion=%s\n" \
            "${{ secrets.OCI_CLI_USER }}" "${{ secrets.OCI_CLI_TENANCY }}" "${{ secrets.OCI_CLI_FINGERPRINT }}" "${{ env.OCI_CLI_REGION }}" > ~/.oci/config
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub
      - name: Snipe ${{ matrix.ad.label }}
        timeout-minutes: 360
        run: |
          AD_NAME="${{ matrix.ad.name }}"
          AD_LABEL="${{ matrix.ad.label }}"
          
          
          for i in $(seq 1 340); do
            echo "[$AD_LABEL] === Attempt $i/340 ==="
            OCI_OUTPUT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "coolify-vm-1c6g" \
              --boot-volume-size-in-gbs 200 2>&1 || true)

            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "🎉 SNIPE SUCCESS on $AD_LABEL! (1C6G)"
              
              # Stop other AD jobs immediately
              echo "Stopping other AD jobs..."
              RUN_ID=${{ github.run_id }}
              JOB_NAME="${{ github.job }}"
              curl -s -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" | \
                jq -r '.jobs[] | select(.status=="in_progress" or .status=="queued") | select(.name!="'"$JOB_NAME"'") | .id' | \
                while read jid; do
                  echo "  Cancelling job $jid..."
                  curl -s -X POST -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                    "https://api.github.com/repos/${{ github.repository }}/actions/jobs/$jid/cancel"
                done
              echo "Other jobs stopped, proceeding with upgrade..."
              
              # Extract instance ID
              INSTANCE_ID=$(echo "$OCI_OUTPUT" | grep -o '"id": "[^"]*"' | head -1 | cut -d'"' -f4)
              
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode "text=🎉 抢到了！$AD_LABEL 1C6G ARM | 开始自动升级到 4C24G..."
              
              echo "=== Starting upgrade to 4C24G ==="
              for u in $(seq 1 120); do
                echo "[Upgrade] Attempt $u/120"
                UPGRADE_OUT=$(oci compute instance update --instance-id "$INSTANCE_ID" \
                  --shape-config '{"ocpus":4,"memoryInGBs":24}' --force 2>&1 || true)
                
                if echo "$UPGRADE_OUT" | grep -q '"lifecycle-state": "RUNNING"'; then
                  echo "✅ Upgrade to 4C24G successful!"
                  curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                    --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                    --data-urlencode "text=✅ 升级完成！$AD_LABEL 4C24G ARM 已就绪，SSH 连接：ssh -o GSSAPIAuthentication=no ubuntu@<公网IP>"
                  exit 0
                fi
                
                echo "[Upgrade] Attempt $u failed (no capacity for 4C24G yet)"
                if [ $u -lt 120 ]; then
                  sleep 60
                fi
              done
              
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode "text=⚠️ 升级超时：抢到 1C6G 但 120次尝试未能扩到 4C24G，需手动在控制台升级"
              exit 0
            fi

            echo "[$AD_LABEL] Attempt $i failed."

            if [ $((i % 90)) -eq 0 ]; then
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode "text=🔵 $AD_LABEL 仍在抢购中 ($i/340)，暂无资源"
            fi

            if [ $i -lt 340 ]; then
              sleep 30
            fi
          done

          echo "[$AD_LABEL] All 340 attempts failed."
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🔴 $AD_LABEL round ended, next round in ~6h"
